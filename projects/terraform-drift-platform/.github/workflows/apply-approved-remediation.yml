name: Apply Approved Terraform Remediation

on:
  workflow_dispatch:

jobs:
  apply-remediation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/terraform-drift-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Apply remediation (dev)
        run: |
          python app/cli/remediation_apply.py --env-path terraform/envs/dev

